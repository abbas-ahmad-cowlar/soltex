<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolteX -- Projects</title>
  <meta name="description" content="Your local LaTeX workspace. Manage and edit LaTeX projects.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">

  <!-- Prevent FOUC: apply stored theme before paint -->
  <script>
    (function(){var t=localStorage.getItem('soltex-app-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
  </script>
</head>
<body class="dashboard-body">
  <header class="dashboard-header">
    <div class="header-left">
      <h1 class="logo">
        <i data-lucide="leaf" class="logo-icon"></i>
        SolteX
      </h1>
      <span class="header-subtitle">Your LaTeX Workspace</span>
    </div>
    <div class="header-right">
      <button id="btn-theme-toggle" class="btn btn-icon-only" title="Toggle theme">
        <i data-lucide="moon"></i>
      </button>
      <div class="view-toggle">
        <button id="btn-grid-view" class="btn btn-icon-only active" title="Grid view"><i data-lucide="layout-grid"></i></button>
        <button id="btn-list-view" class="btn btn-icon-only" title="List view"><i data-lucide="list"></i></button>
      </div>
      <button id="btn-new-project" class="btn btn-primary">
        <i data-lucide="plus" style="width:16px;height:16px;"></i>
        <span>New Project</span>
      </button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-toolbar">
      <div class="search-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input id="search-projects" type="text" class="search-input" placeholder="Search projects..." autocomplete="off">
      </div>
      <label class="toggle-label">
        <input type="checkbox" id="show-archived"> Show Archived
      </label>
    </div>

    <div id="projects-container" class="projects-grid">
      <p class="loading-text">Loading projects...</p>
    </div>
  </main>

  <!-- New Project Modal (Phase 5: Template support) -->
  <div id="new-project-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box modal-wide">
      <h2 class="modal-title">Create New Project</h2>

      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="blank">Blank Project</button>
        <button class="modal-tab" data-tab="template">From Template</button>
      </div>

      <div id="tab-blank" class="modal-tab-content">
        <label class="dialog-label" for="new-project-name">Project Name</label>
        <input id="new-project-name" class="dialog-input" type="text" placeholder="e.g., My Thesis" autocomplete="off">
      </div>

      <div id="tab-template" class="modal-tab-content" style="display: none;">
        <label class="dialog-label" for="template-project-name">Project Name</label>
        <input id="template-project-name" class="dialog-input" type="text" placeholder="e.g., My Paper" autocomplete="off">
        <div id="template-grid" class="template-grid">
          <p class="search-empty">Loading templates...</p>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-create" class="btn btn-primary">Create</button>
      </div>
      <p id="modal-error" class="modal-error" style="display: none;"></p>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
